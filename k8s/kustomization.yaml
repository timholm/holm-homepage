apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
- namespace.yaml
- deployment.yaml
- oauth.yaml
- oauth-sealed.yaml # Holm SSO (Authelia) client; sealed, safe in a public repo
configMapGenerator:
- name: homepage-site
  files:
  - index.html
generatorOptions:
  disableNameSuffixHash: false
