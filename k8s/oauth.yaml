apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage-oauth
  namespace: homepage
spec:
  replicas: 2
  selector:
    matchLabels: {app: homepage-oauth}
  template:
    metadata:
      labels: {app: homepage-oauth}
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
        args:
        - --http-address=0.0.0.0:4180
        # 2026-07-01: holm.team root now serves CryptPad; homepage's canonical
        # URL is index.holm.team (tunnel + DNS already in place).
        - --redirect-url=https://index.holm.team/oauth2/callback
        - --oidc-issuer-url=https://sso.holm.team
        - --provider=oidc
        - --skip-oidc-discovery=true # no network at boot: a down edge must not crashloop the proxy
        - --login-url=https://sso.holm.team/api/oidc/authorization
        - --redeem-url=https://sso.holm.team/api/oidc/token
        - --oidc-jwks-url=https://sso.holm.team/jwks.json
        - --profile-url=https://sso.holm.team/api/oidc/userinfo
        # Skip boot-time OIDC discovery: it hits the issuer URL through the
        # Cloudflare tunnel and kills the pod with 530/error 1033 any time the
        # tunnel is down (this crashlooped 850+ times). Only the browser leg
        # (login-url) needs to be public; server-to-server calls go to the
        # in-cluster keycloak Service. Keycloak's KC_HOSTNAME is pinned to
        # https://auth.holm.team so the `iss` claim still matches.
        - --upstream=http://homepage.homepage.svc.cluster.local:80
        - --cookie-domain=.holm.team
        - --cookie-secure=true
        - --cookie-samesite=lax
        - --whitelist-domain=.holm.team
        - --email-domain=*
        - --scope=openid email profile groups
        - --allowed-group=admins # LLDAP security group, via Authelia
        - --skip-provider-button=true
        - --pass-access-token=true
        - --pass-authorization-header=true
        - --set-authorization-header=true
        - --reverse-proxy=true
        env:
        - {name: OAUTH2_PROXY_CLIENT_ID,     valueFrom: {secretKeyRef: {name: homepage-oauth-secrets, key: client-id}}}
        - {name: OAUTH2_PROXY_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: homepage-oauth-secrets, key: client-secret}}}
        - {name: OAUTH2_PROXY_COOKIE_SECRET, valueFrom: {secretKeyRef: {name: homepage-oauth-secrets, key: cookie-secret}}}
        ports:
        - {containerPort: 4180}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits:   {cpu: 200m, memory: 128Mi}
        readinessProbe:
          httpGet: {path: /ping, port: 4180}
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: homepage-oauth
  namespace: homepage
spec:
  selector: {app: homepage-oauth}
  ports:
  - port: 80
    targetPort: 4180
